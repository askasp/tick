# etc/tick.conf — every setting, in one place. Sourced by every script.
# A variable already set in the environment wins:  MAX_RUNS=5 t run 42

: "${T_VAR:=$HOME/.tick}"              # all state: tasks/ (one dir per task), run/ (agent slots)
: "${T_PIPELINE:=local}"               # the pipeline `t new` uses without -p, when the repo names none
: "${T_REPO:=amino}"                   # the repo `t new` uses outside any repo: a name from repos/, or a path
: "${T_REPOS:=$HOME/git}"              # where `-r NAME` looks when NAME isn't in repos/
: "${DIFF_MAX:=200000}"                # bytes of diff a step puts in a prompt; an agent reads the rest itself
: "${MAX_RUNS:=3}"                     # runs of one step before the task holds; moving on starts over
: "${T_CLI:=opencode}"                 # the CLI for a step whose pipeline doesn't name one (CLI_<step>=)
: "${SLOTS_claude:=3}"                 # how many agents of each CLI may run at once;
: "${SLOTS_opencode:=2}"               #   match vLLM's --max-num-seqs (2): more only queue inside vLLM
: "${T_EFFORT:=high}"                  # how hard claude thinks (low, medium, high, xhigh, max);
                                       #   EFFORT_<step>= in a pipeline's env changes it for one step
: "${GPU_BUSY:=pgrep -x reaper}"       # while this command succeeds, jobs/idle-review reads nothing.
                                       #   Steam launches every game through reaper, and it is a process
                                       #   name, not a pattern: pgrep -f would match the shell asking
: "${IDLE_PASSES:=2}"                  # times one mindset reads one commit in jobs/idle-review before it lets it be
: "${IDLE_FIXES:=3}"                   # findings that job may ask one finished task to fix, ever
: "${CLAUDE_EDIT_MODE:=acceptEdits}"   # bypassPermissions also lets it run any command

# cron starts us with PATH=/usr/bin:/bin, and the agent CLIs live in $HOME
PATH=$PATH:$HOME/.local/bin:$HOME/.opencode/bin:$HOME/.bun/bin
